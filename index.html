<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa Arácnida!</title>
    <style>
        /* Importamos una fuente tipo cómic de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d1b2a; /* Fondo oscuro tipo noche en la ciudad */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Evita que la pantalla haga scroll cuando caiga la tapa */
        }

        .gift-container {
            position: relative;
            width: 320px;
            height: 450px;
        }

        /* -------------------------------------
           CONTENIDO INTERIOR (La Sorpresa)
           ------------------------------------- */
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #003bbc, #002379); /* Azul Spider-Man */
            border-radius: 15px;
            border: 5px solid #e23636;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            box-sizing: border-box;
            color: white;
        }

        .content h1 {
            font-family: 'Bangers', cursive; 
            font-size: 3.5em;
            color: #e23636; /* Rojo Spider-Man */
            /* Borde blanco al texto para estilo cómic */
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            margin: 0;
            letter-spacing: 2px;
            line-height: 1;
        }

        .content p {
            font-size: 1.2em;
            margin-top: 20px;
            line-height: 1.5;
        }

        .spider-icon {
            font-size: 60px;
            margin-top: 15px;
            animation: swing 2s infinite ease-in-out alternate;
        }

        @keyframes swing {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        /* -------------------------------------
           ENVOLTURA (La que se cae)
           ------------------------------------- */
        .wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e23636; /* Rojo */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Efecto de cuadrícula/telaraña sutil en el fondo */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.2) 2px, transparent 2px);
            background-size: 30px 30px;
            transition: transform 1.2s cubic-bezier(0.55, 0.085, 0.68, 0.53), opacity 1s;
            z-index: 10;
        }

        /* Listones de la envoltura (Azul Spider-Man) */
        .wrapper::before, .wrapper::after {
            content: '';
            position: absolute;
            background-color: #003bbc;
        }

        /* Listón vertical */
        .wrapper::before {
            width: 40px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        /* Listón horizontal */
        .wrapper::after {
            height: 40px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        .bow-center {
            position: absolute;
            z-index: 11;
            font-size: 70px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .click-text {
            position: absolute;
            bottom: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.5em;
            letter-spacing: 1px;
            z-index: 11;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* -------------------------------------
           ANIMACIÓN DE CAÍDA (JavaScript activa esto)
           ------------------------------------- */
        .wrapper.fall-down {
            /* Mueve la caja hacia abajo fuera de la pantalla y la gira un poco */
            transform: translateY(150vh) rotate(25deg);
            opacity: 0;
            pointer-events: none;
        }

    </style>
</head>
<body>

<div class="gift-container">
    
    <!-- LO QUE HAY ADENTRO -->
    <div class="content">
        <h1>¡Feliz Día!</h1>
        <p>🕸️ Tu sentido arácnido no te engañaba... 🕸️</p>
        <p>¡Disfruta de este regalo especial cortesía de tu amigable vecino!</p>
        <div class="spider-icon">🕷️</div>
    </div>

    <!-- LA ENVOLTURA EXTERIOR -->
    <!-- Al hacer clic, ejecuta la función de JavaScript -->
    <div class="wrapper" id="giftWrapper" onclick="abrirRegalo()">
        <div class="bow-center">🎀</div>
        <div class="click-text">¡Toca para desenredar!</div>
    </div>

</div>

<script>
    // Función que hace que la caja se caiga
    function abrirRegalo() {
        const wrapper = document.getElementById('giftWrapper');
        wrapper.classList.add('fall-down'); // Añade la clase CSS de caída
    }
</script>

</body>
</html>
